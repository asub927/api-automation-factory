name: factory-propose

# Operator-initiated only (v1). Do not auto-run on every contracts/** commit.
# Suites land on the mapped app workspace repo under playwright/ — never auto-merge.
on:
  workflow_dispatch:
    inputs:
      service:
        description: Service id (e.g. demo)
        required: true
        default: demo
      workspace_dir:
        description: Local app workspace checkout (defaults to fixtures/workspace-app for dry-run)
        required: false
        default: fixtures/workspace-app

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Propose dry-run (scaffold + emit into workspace dir)
        run: >
          npx tsx src/cli/index.ts propose
          --service ${{ inputs.service }}
          --workspace-dir ${{ inputs.workspace_dir }}
          --dry-run
      - name: Open draft PR on workspace remote
        if: ${{ false }} # enable when GitHub App credentials + workspace checkout are configured; never auto-merge
        run: >
          npx tsx src/cli/index.ts propose
          --service ${{ inputs.service }}
          --workspace-dir ${{ inputs.workspace_dir }}
          --open-pr
        # Path filter enforced in-process: playwright/api/<service>/** + support/scaffold only.
        # Target repo comes from contracts/<service>/service.manifest.yaml workspace.repo.
